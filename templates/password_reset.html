{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password | FoodSafe</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <main class="container">
        <div class="card" style="max-width:450px; margin:50px auto;">
            <h1>Forgot Password?</h1>
            <p>Enter your registered email address to request a reset link.</p>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn" type="submit">Send Reset Link</button>
            </form>

            <p><a href="{% url 'login' %}">Back to Login</a></p>
        </div>
    </main>
</body>
</html>
